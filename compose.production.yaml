# Public deployment template: external PostgreSQL/Redis, HTTPS reverse proxy.
# Supply an ignored .env.production; this file does not publish the local stack.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_DEBUG: "0"
      DEMO_MODE: "0"
      JUWA2_MOCK: "0"
      DOLLARPAY_DEV_MODE: "0"
      DJANGO_TRUST_PROXY: "1"
    command: sh -c "python manage.py migrate && python manage.py disable_local_mode && python manage.py seed_platforms && python manage.py bootstrap_provider_connections && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/',timeout=5).read()"]
      interval: 15s
      timeout: 7s
      retries: 5
  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in the production env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
